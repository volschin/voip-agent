name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check agent/ tests/ dgx/tts/

      - name: Ruff format check
        run: ruff format --check agent/ tests/ dgx/tts/

  container-smoke:
    name: Build and import production images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and import production runtime
        run: |
          docker build --file Dockerfile --tag voip-agent-ci:production .
          docker run --rm --entrypoint python voip-agent-ci:production \
            -c "import agent.main, pjsua2, webrtcvad"

      - name: Build and import signalling PoC runtime
        run: |
          docker build --file Dockerfile.pjsip-poc --tag voip-agent-ci:pjsip-poc .
          docker run --rm --entrypoint python voip-agent-ci:pjsip-poc \
            -c "import agent.pjsip_poc, pjsua2, webrtcvad"

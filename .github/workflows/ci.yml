name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check agent/ tests/ dgx/tts/

      - name: Ruff format check
        run: ruff format --check agent/ tests/ dgx/tts/

  container-smoke:
    needs: [test, lint]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: write
    name: Build and import production images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and import production runtime
        run: |
          docker build --file Dockerfile --build-arg SOURCE_REVISION="$SOURCE_SHA" --tag voip-agent-ci:production .
          docker run --rm --entrypoint python voip-agent-ci:production \
            -c "import agent.main, pjsua2, webrtcvad"

      - name: Build and import signalling PoC runtime
        run: |
          docker build --file Dockerfile.pjsip-poc --tag voip-agent-ci:pjsip-poc .
          docker run --rm --entrypoint python voip-agent-ci:pjsip-poc \
            -c "import agent.pjsip_poc, pjsua2, webrtcvad"

      - name: Verify packaged turn detector offline
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
            --entrypoint python voip-agent-ci:production \
            -c "from agent.turn_detector import TurnDetector; TurnDetector(model_repo='pipecat-ai/smart-turn-v3', model_filename='smart-turn-v3.2-cpu.onnx', model_revision='f766f81d3cfdf7737ac64aad813d91bbfd56bf93', providers=['CPUExecutionProvider'])"

      - name: Publish verified source image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          image="ghcr.io/${SOURCE_REPOSITORY,,}:sha-${SOURCE_SHA}"
          docker tag voip-agent-ci:production "$image"
          docker push "$image"
          printf 'Published source %s: `%s`\n' "$SOURCE_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"

services:
  voip-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PJSIP_COMMIT: 5a457451fa2712ba18e12b01738e8ff3af2b26fd
    env_file:
      # Production reads a single file. FRITZ!Box SIP credentials and PJSIP
      # tuning live in .env; .env.pjsip-poc belongs to compose.pjsip-poc.yml.
      - .env
    environment:
      PJSIP_LOG_LEVEL: ${PJSIP_LOG_LEVEL:-2}
    extra_hosts:
      - "dgx-spark:${DGX_HOST_IP:-192.168.68.41}"
      - "${AI_ORIGIN_HOST:-mate.olcon.de}:${DGX_HOST_IP:-192.168.68.41}"
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - agent-model-cache:/home/voip-agent/.cache
      - /home/volsch/voip-agent/secrets/shared_ai_password:/run/secrets/shared_ai_password:ro
      - /home/volsch/voip-agent/secrets/mate_ca.crt:/run/secrets/mate_ca.crt:ro
      - /home/volsch/voip-agent/secrets/voice_priority_token:/run/secrets/voice_priority_token:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  agent-model-cache:

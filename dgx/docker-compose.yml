services:
  qwen3-asr:
    image: ghcr.io/aeon-7/qwen3-asr-server:latest
    container_name: qwen3-asr
    runtime: nvidia
    environment:
      # Scope to specific GPUs in production to limit blast radius, e.g. "0".
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - ENABLE_NVFP4_SM100=0
      - VLLM_TEST_FORCE_FP8_MARLIN=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # - HF_TOKEN=...
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    networks:
      - default
      - shared_ai_voice
    shm_size: "4gb"
    restart: unless-stopped
    labels:
      - "autoheal=true"
    command:
      - vllm
      - serve
      - /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-0.6B/snapshots/5eb144179a02acc5e5ba31e748d22b0cf3e303b0
      - --served-model-name
      - qwen3-asr
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --gpu-memory-utilization
      - "0.08"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "4"
      - --trust-remote-code
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/v1/models',timeout=3)); assert any(model.get('id') == 'qwen3-asr' for model in data.get('data',[]))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  qwen3-tts:
    # Built locally from ./tts — faster-qwen3-tts runtime with the custom
    # /v1/audio/speech/stream endpoint the streaming pipeline (#3) depends on.
    # The aeon-7 upstream image cannot carry this endpoint.
    build: ./tts
    container_name: qwen3-tts
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # - QWEN_TTS_MODEL=Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
      # - QWEN_TTS_TOKENIZER=Qwen/Qwen3-TTS-Tokenizer-12Hz
      # - QWEN_TTS_ATTN_IMPL=flash_attention_2
      # - QWEN_TTS_DEFAULT_VOICE=A neutral, friendly adult voice ...
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    networks:
      - default
      - shared_ai_voice
    shm_size: "4gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=3)); assert data.get('model_loaded') is True"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "autoheal=true"

  embedding:
    image: ghcr.io/volschin/voip-agent-embedding:latest
    container_name: voip-embedding
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "${DGX_BIND_IP:-0.0.0.0}:8003:8003"
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: voip-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=180
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  shared_ai_voice:
    external: true
    name: shared_ai_voice

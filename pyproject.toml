[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "voip-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "msal>=1.28",
    "scipy>=1.13",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "webrtcvad-wheels>=2.0.14",
    "aiofiles>=23.2",
    "onnxruntime>=1.18",
    "transformers>=4.44",
    "huggingface_hub>=0.24",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "realmodel: downloads the real Smart Turn v3 ONNX model (skipped in CI)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

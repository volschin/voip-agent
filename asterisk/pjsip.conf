; ── Transport ──────────────────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; ── Fritzbox SIP trunk ─────────────────────────────────────────────────────
[fritzbox]
type=registration
transport=transport-udp
outbound_auth=fritzbox-auth
server_uri=sip:<FRITZBOX_IP>
client_uri=sip:<SIP_USER>@<FRITZBOX_IP>
retry_interval=30
expiration=120

[fritzbox-auth]
type=auth
auth_type=userpass
username=<SIP_USER>
password=<SIP_PASSWORD>

[fritzbox-aor]
type=aor
contact=sip:<FRITZBOX_IP>

[fritzbox-endpoint]
type=endpoint
transport=transport-udp
context=from-fritzbox
disallow=all
allow=alaw
outbound_auth=fritzbox-auth
aors=fritzbox-aor
from_user=<YOUR_PHONE_NUMBER>
from_domain=<FRITZBOX_IP>

[fritzbox-identify]
type=identify
endpoint=fritzbox-endpoint
match=<FRITZBOX_IP>

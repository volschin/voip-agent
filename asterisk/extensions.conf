[general]
static=yes
writeprotect=no

; ── Inbound calls from Fritzbox ────────────────────────────────────────────
[from-fritzbox]
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(voip-agent)
 same => n,Hangup()

; ── Local test extension (dial 9999 to test pipeline) ─────────────────────
[default]
exten => 9999,1,Answer()
 same => n,Stasis(voip-agent)
 same => n,Hangup()

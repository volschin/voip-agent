services:
  answering-machine-poc:
    build:
      context: .
      dockerfile: Dockerfile.pjsip
      args:
        PJSIP_COMMIT: 5a457451fa2712ba18e12b01738e8ff3af2b26fd
    env_file:
      - ${PJSIP_ENV_FILE:-.env.pjsip}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
